version: "3.8"

services:
  daily-content-ideas:
    build: .
    container_name: daily-content-ideas
    restart: unless-stopped
    ports:
      - "3060:3060"
    environment:
      # Lim inn din Anthropic API-nøkkel her (fra console.anthropic.com)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CLAUDE_MODEL=claude-sonnet-4-6
      - IDEAS_PER_BATCH=8
      # Cron: min hour day month weekday -> "0 7 * * *" = every day at 07:00
      - CRON_SCHEDULE=0 7 * * *
      # Per-tab brand context has sensible defaults baked into server.js (Kygo,
      # Palm Tree Productions, Johannes Lovund). Override any of them here if needed:
      # - BRAND_CONTEXT_KYGO=...
      # - BRAND_CONTEXT_PTP=...
      # - BRAND_CONTEXT_JOHANNES=...
      # Restricts which origin may call the API from a browser (CORS)
      - ALLOWED_ORIGIN=https://ptp-internal.pages.dev
    volumes:
      - ./data:/app/data

  cloudflared:
    build: ./cloudflared
    container_name: cloudflared-content-ideas
    restart: unless-stopped
    environment:
      - TARGET_URL=http://daily-content-ideas:3060
      - REPORT_URL=https://ptp-internal.pages.dev/api/content-ideas-url
      # Delt hemmelighet - samme verdi som Cloudflare Pages secret TUNNEL_UPDATE_SECRET
      # (satt via: npx wrangler pages secret put TUNNEL_UPDATE_SECRET). IKKE i koden.
      - TUNNEL_UPDATE_SECRET=${TUNNEL_UPDATE_SECRET}
    depends_on:
      - daily-content-ideas

  # Self-hosted GitHub Actions runner: lets pushes to the repo auto-rebuild and
  # restart the daily-content-ideas / cloudflared services above, with no manual
  # Portainer "pull and redeploy" step. Registers itself once (using RUNNER_TOKEN,
  # a short-lived one-time token) and persists its credentials in runner_data, so
  # it never needs a new token again unless that volume is wiped.
  runner:
    build: ./runner
    container_name: gh-runner-content-ideas
    restart: unless-stopped
    environment:
      - REPO_URL=https://github.com/johanneslovund/daily-content-ideas
      # One-time registration token (expires ~1 hour after issue). Only needed
      # the first time this container starts; ignored afterwards.
      - RUNNER_TOKEN=${GH_RUNNER_TOKEN}
      - RUNNER_NAME=nas-daily-content-ideas
    volumes:
      - runner_data:/actions-runner
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  runner_data:
