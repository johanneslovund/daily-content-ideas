name: Lead Finder Daily

on:
  schedule:
    # 03:00 UTC = 05:00 Norway time during CEST (summer time, UTC+2). GitHub Actions
    # cron is always UTC with no timezone option - this will need updating to 04:00
    # UTC once Norway switches back to CET (UTC+1) in late October, or it'll quietly
    # drift to 06:00 local.
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  discover:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: cd lead-finder && npm install --no-audit --no-fund

      - name: Run lead discovery
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PTP_SITE_DEPLOY_KEY: ${{ secrets.PTP_SITE_DEPLOY_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node lead-finder/discover.js
