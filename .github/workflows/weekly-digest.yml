name: Weekly Digest Email

on:
  schedule:
    # 08:00 UTC Monday = 10:00 Norway time during CEST - well after the Konkurranse/Event
    # weekly jobs (05:30/05:45) so the digest can include that morning's results too.
    # Bump to 09:00 UTC once DST ends in late October.
    - cron: "0 8 * * 1"
  workflow_dispatch: {}

jobs:
  digest:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: cd lead-finder && npm install --no-audit --no-fund

      - name: Send weekly digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PTP_SITE_DEPLOY_KEY: ${{ secrets.PTP_SITE_DEPLOY_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_FROM_EMAIL: ${{ secrets.DIGEST_FROM_EMAIL }}
          SITE_BASIC_AUTH: ${{ secrets.SITE_BASIC_AUTH }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: node lead-finder/weekly-digest.js
