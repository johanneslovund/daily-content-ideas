name: Konkurranse Weekly

on:
  schedule:
    # 03:30 UTC Monday = 05:30 Norway time during CEST. Bump to 04:30 UTC once DST
    # ends in late October (GitHub Actions cron has no timezone option).
    - cron: "30 3 * * 1"
  workflow_dispatch: {}

jobs:
  discover:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: cd lead-finder && npm install --no-audit --no-fund

      - name: Run competitor discovery
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PTP_SITE_DEPLOY_KEY: ${{ secrets.PTP_SITE_DEPLOY_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node lead-finder/discover-konkurranse.js
